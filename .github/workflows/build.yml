name: Build M1 Player APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o m1-player-android.zip
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          if [ -d "m1-player-android" ]; then
            cd m1-player-android
          fi
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M1-Player-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            m1-player-android/app/build/outputs/apk/debug/*.apk
