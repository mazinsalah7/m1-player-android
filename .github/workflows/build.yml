name: Build M1 Player APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o m1-player-android.zip
          ls -la
          if [ -d "m1-player-android" ]; then
            cp -r m1-player-android/*.
            cp -r m1-player-android/.gradle. 2>/dev/null || true
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build APK
        run:./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M1-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
